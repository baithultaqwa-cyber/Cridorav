    <style>
      /* Instant PWA paint before the JS bundle — theme sheet #0c0a07 + centered seal */
      #cridora-boot-splash {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10000;
        flex-direction: column;
        align-items: center;

        gap: 1rem;
        background: #0c0a07;
        color: #f6efdd;
        margin: 0;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        transition: opacity 0.42s cubic-bezier(0.16, 1, 0.3, 1);
      }
      html.cridora-pwa-standalone #cridora-boot-splash {
        display: flex;
      }
      @media (display-mode: standalone), (display-mode: minimal-ui) {
        #cridora-boot-splash { display: flex; }
      }
      #cridora-boot-splash.is-exit { opacity: 0; pointer-events: none; }
      #cridora-boot-splash img {
